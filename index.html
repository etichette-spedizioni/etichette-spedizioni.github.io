
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Etichette spedizioni</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f6f7;color:#171717;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{width:min(900px,100%);margin:0 auto;padding:28px 18px 48px;display:flex;flex-direction:column;align-items:center;gap:18px}
#pick{appearance:none;border:0;border-radius:12px;background:#161616;color:#fff;padding:17px 28px;font:650 17px system-ui;cursor:pointer;min-width:min(300px,92vw);box-shadow:0 2px 8px #00000016}
#pick:disabled{opacity:.55;cursor:wait}
#files{display:none}
#status{min-height:24px;color:#555;font-size:14px;text-align:center;max-width:680px;line-height:1.45}
#result{display:none;width:100%}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.result-head h2{font-size:17px;font-weight:650;margin:0}
#download{color:#1558b0;text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:600}
#preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.preview-page{background:#fff;border:1px solid #d8dadd;border-radius:10px;padding:10px;box-shadow:0 2px 8px #0000000b}
.page-name{font-size:12px;color:#666;margin:0 0 8px}
.preview-page canvas{display:block;width:100%;height:auto;background:#fff}
.note{font-size:12px;color:#777;text-align:center;line-height:1.45;max-width:650px}
@media(max-width:520px){main{padding:20px 12px 32px}#preview{grid-template-columns:1fr}.preview-page{padding:7px}}
</style>
</head>
<body>
<main>
  <input id="files" type="file" accept="application/pdf,.pdf" multiple>
  <button id="pick" type="button">＋ Seleziona i PDF</button>
  <div id="status" role="status" aria-live="polite">Seleziona uno o più PDF. Puoi aggiungere nuove etichette anche a un PDF A4 già preparato con questa versione del sito.</div>
  <section id="result" aria-live="polite">
    <div class="result-head">
      <h2>Anteprima del PDF A4</h2>
      <a id="download" href="#" download="etichette_pronte_A4.pdf">Scarica il PDF pronto</a>
    </div>
    <div id="preview"></div>
  </section>
  <div class="note">Controlla l'anteprima prima di stampare. Per la stampa usa A4, dimensioni effettive / 100%, senza adattamento automatico alla pagina.</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
'use strict';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const input = document.getElementById('files');
const button = document.getElementById('pick');
const statusBox = document.getElementById('status');
const result = document.getElementById('result');
const preview = document.getElementById('preview');
const download = document.getElementById('download');

const A4 = { width: 595.2756, height: 841.8898 };
const HALF_W = A4.width / 2;
const HALF_H = A4.height / 2;

const LAYOUT_MARKER = 'ETICHETTE_SPEDIZIONI_LAYOUT_V5';

const PREVIOUS_MARKERS = [
  'ETICHETTE_SPEDIZIONI_LAYOUT_V3',
  'ETICHETTE_SPEDIZIONI_LAYOUT_V4'
];

const MAX_QUADRANT_SHRINK = 0.02;

let currentUrl = null;


// -----------------------------------------------------
// SELEZIONE DEI PDF
// -----------------------------------------------------

button.addEventListener('click', () => input.click());

input.addEventListener('change', async () => {
  if (!input.files || input.files.length === 0) return;

  button.disabled = true;
  result.style.display = 'none';
  preview.replaceChildren();

  statusBox.textContent =
    'Sto leggendo i PDF e recuperando le etichette…';

  try {
    const inpost = [];
    const other = [];

    let importedInpost = 0;
    let importedOther = 0;

    for (const file of Array.from(input.files)) {
      const isPdf =
        file.type === 'application/pdf' ||
        file.name.toLowerCase().endsWith('.pdf');

      if (!isPdf) continue;

      const bytes = new Uint8Array(await file.arrayBuffer());

      const pdfJsDoc = await pdfjsLib.getDocument({
        data: bytes.slice()
      }).promise;

      const sourceDoc = await PDFLib.PDFDocument.load(bytes);

      const metadata = await pdfJsDoc
        .getMetadata()
        .catch(() => null);

      const info = metadata?.info || {};

      const subject = String(
        info.Subject || info.subject || ''
      );

      const metaText = [
        subject,
        info.Keywords || info.keywords || '',
        info.Title || info.title || ''
      ].join(' ').toUpperCase();

      // Si accettano come PDF già elaborati soltanto
      // quelli che contengono la firma della versione 5.
      const isV5 = metaText.includes(LAYOUT_MARKER);

      const oldVersion = PREVIOUS_MARKERS.find(
        marker => metaText.includes(marker)
      );

      if (oldVersion && !isV5) {
        throw new Error(
          `Il file "${file.name}" è stato creato con una versione precedente (${oldVersion}). Questa versione importa solo PDF creati dalla versione 5. Per riutilizzarlo, seleziona i PDF originali e ricrealo.`
        );
      }

      const generatedLayout = isV5
        ? parseGeneratedLayout(subject)
        : null;

      if (isV5 && !generatedLayout) {
        throw new Error(
          `Il PDF "${file.name}" contiene la firma V5, ma la mappa delle etichette non è leggibile.`
        );
      }

      if (
        isV5 &&
        generatedLayout.length !== pdfJsDoc.numPages
      ) {
        throw new Error(
          `La mappa del PDF "${file.name}" non corrisponde al numero delle pagine.`
        );
      }

      for (
        let pageNumber = 1;
        pageNumber <= pdfJsDoc.numPages;
        pageNumber++
      ) {
        statusBox.textContent =
          `Analisi: ${file.name} — pagina ${pageNumber}/${pdfJsDoc.numPages}…`;

        const jsPage = await pdfJsDoc.getPage(pageNumber);

        const viewport = jsPage.getViewport({
          scale: 1
        });

        const sourcePage = sourceDoc.getPages()[pageNumber - 1];

        const sourceWidth = sourcePage.getWidth();
        const sourceHeight = sourcePage.getHeight();

        const pageIndex = pageNumber - 1;

        // =============================================
        // PDF GIÀ ELABORATI CON VERSIONE 5
        // =============================================

        if (isV5) {
          if (!isA4Portrait(sourceWidth, sourceHeight)) {
            throw new Error(
              `La pagina ${pageNumber} del PDF V5 "${file.name}" non è in formato A4 verticale.`
            );
          }

          const layout = generatedLayout[pageIndex];

          const crops = layout.mode === 'Q'
            ? getQuadrantCrops(sourceWidth, sourceHeight)
            : getHalfCrops(sourceWidth, sourceHeight);

          for (
            let slot = 0;
            slot < layout.slots.length;
            slot++
          ) {
            const code = layout.slots[slot];

            if (code === '-') continue;

            const crop = crops[slot];

            if (code === 'I') {
              inpost.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  'inpost',
                  crop
                )
              );

              importedInpost++;

            } else if (code === 'O') {
              const kind = layout.mode === 'Q'
                ? 'imported-quadrant'
                : 'imported-half';

              other.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  kind,
                  crop
                )
              );

              importedOther++;
            }
          }

          continue;
        }

        // =============================================
        // PDF ORIGINALI
        // =============================================

        const textContent = await jsPage.getTextContent();

        const text = textContent.items
          .filter(item => (item.str || '').trim().length > 0)
          .map(item => item.str || '')
          .join(' ')
          .toLowerCase();

        const kind = classifySourcePage(text);

        if (!kind) {
          throw new Error(
            `Formato non riconosciuto: ${file.name}, pagina ${pageNumber}. Sono supportati i PDF originali InPost, BRT e DPD con istruzioni dei modelli forniti, oppure PDF già creati dalla versione 5.`
          );
        }

        const crop = getSourceCrop(
          kind,
          sourceWidth,
          sourceHeight
        );

        const item = makeItem(
          file.name,
          pageNumber,
          sourceDoc,
          pageIndex,
          kind,
          crop
        );

        if (kind === 'inpost') {
          inpost.push(item);
        } else {
          other.push(item);
        }
      }
    }

    if (inpost.length + other.length === 0) {
      throw new Error(
        'Non ho trovato etichette nei PDF selezionati.'
      );
    }

    statusBox.textContent =
      'Sto impaginando le etichette e preparando l’anteprima…';

    const composed = await compose(inpost, other);

    const outputBytes = composed.bytes;

    const blob = new Blob(
      [outputBytes],
      { type: 'application/pdf' }
    );

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
    }

    currentUrl = URL.createObjectURL(blob);

    download.href = currentUrl;
    result.style.display = 'block';

    await renderPreview(outputBytes);

    const importedTotal =
      importedInpost + importedOther;

    const importedMessage = importedTotal
      ? ` Recuperate ${importedTotal} etichette dal PDF V5 già preparato (${importedInpost} InPost e ${importedOther} altre).`
      : '';

    statusBox.textContent =
      `PDF pronto: ${inpost.length} InPost e ${other.length} altre etichette. ` +
      `${composed.otherInQuadrants} altre etichette inserite nei quadranti. ` +
      `${composed.otherTwoUp} etichette non entrate nei quadranti impaginate due per foglio. ` +
      `Totale: ${composed.layout.length} pagine A4.` +
      importedMessage;

    result.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  } catch (error) {
    console.error(error);

    statusBox.textContent =
      error?.message ||
      'Errore durante la preparazione del PDF.';

    result.style.display = 'none';

  } finally {
    button.disabled = false;
    input.value = '';
  }
});


// -----------------------------------------------------
// METADATI E IDENTIFICAZIONE DEL PDF V5
// -----------------------------------------------------

function parseGeneratedLayout(subject) {
  const marker = LAYOUT_MARKER + '|';

  const position = String(subject || '').indexOf(marker);

  if (position < 0) return null;

  const encoded = String(subject)
    .slice(position + marker.length)
    .trim();

  if (!encoded) return null;

  const records = encoded
    .split(';')
    .map(value => value.trim())
    .filter(Boolean);

  const layouts = [];

  for (const record of records) {
    const separator = record.indexOf(':');

    if (separator < 0) return null;

    const mode = record.slice(0, separator);
    const slots = record.slice(separator + 1);

    if (mode === 'Q') {
      if (
        slots.length !== 4 ||
        !/^[IO-]{4}$/.test(slots)
      ) return null;

      layouts.push({
        mode: 'Q',
        slots: slots.split('')
      });

    } else if (mode === 'H') {
      if (
        slots.length !== 2 ||
        !/^[O-]{2}$/.test(slots)
      ) return null;

      layouts.push({
        mode: 'H',
        slots: slots.split('')
      });

    } else {
      return null;
    }
  }

  return layouts.length ? layouts : null;
}


function isA4Portrait(width, height) {
  return (
    Math.abs(width - A4.width) < 3 &&
    Math.abs(height - A4.height) < 3
  );
}


function makeItem(
  fileName,
  pageNumber,
  sourceDoc,
  pageIndex,
  kind,
  crop
) {
  return {
    fileName,
    pageNumber,
    sourceDoc,
    pageIndex,
    kind,
    crop
  };
}


// -----------------------------------------------------
// RICONOSCIMENTO DEI PDF ORIGINALI
// -----------------------------------------------------

function classifySourcePage(text) {
  const normalized = String(text || '').toLowerCase();

  // INPOST
  if (
    normalized.includes('deposito') &&
    normalized.includes('giro') &&
    normalized.includes('mittente')
  ) {
    return 'inpost';
  }

  // DPD CON ISTRUZIONI
  if (
    (
      normalized.includes("stampare l'etichetta") ||
      normalized.includes('un rapido taglio') ||
      normalized.includes('imballare tutto in modo sicuro')
    ) &&
    normalized.includes('order reference')
  ) {
    return 'instructions';
  }

  // BRT / DPD
  if (
    normalized.includes('terms & conditions of services') ||
    normalized.includes('www.dpd.com') ||
    normalized.includes('brt s.p.a.')
  ) {
    return 'brt';
  }

  return null;
}


// -----------------------------------------------------
// RITAGLIO DEI PDF ORIGINALI
// Coordinate PDF: origine in basso a sinistra.
// -----------------------------------------------------

function getSourceCrop(kind, width, height) {
  if (kind === 'inpost') {
    return null;
  }

  // DPD: taglia la zona delle istruzioni.
  if (kind === 'instructions') {
    return {
      left: width * 0.143277,
      bottom: height * (1 - 0.956942),
      right: width * 0.856723,
      top: height * (1 - 0.620439)
    };
  }

  // BRT: ritaglio del modello fornito.
  if (kind === 'brt') {
    return {
      left: width * 0.075427,
      bottom: height * (1 - 0.625973),
      right: width * 0.542102,
      top: height * (1 - 0.175082)
    };
  }

  throw new Error(
    'Tipo di etichetta non gestito.'
  );
}


// -----------------------------------------------------
// RITAGLI DELLE PAGINE GIÀ CREATE DAL SITO
// -----------------------------------------------------

function getQuadrantCrops(width, height) {
  const hw = width / 2;
  const hh = height / 2;

  // 0: alto sinistra
  // 1: alto destra
  // 2: basso sinistra
  // 3: basso destra

  return [
    {
      left: 0,
      bottom: hh,
      right: hw,
      top: height
    },
    {
      left: hw,
      bottom: hh,
      right: width,
      top: height
    },
    {
      left: 0,
      bottom: 0,
      right: hw,
      top: hh
    },
    {
      left: hw,
      bottom: 0,
      right: width,
      top: hh
    }
  ];
}


function getHalfCrops(width, height) {
  const hh = height / 2;

  return [
    {
      left: 0,
      bottom: hh,
      right: width,
      top: height
    },
    {
      left: 0,
      bottom: 0,
      right: width,
      top: hh
    }
  ];
}


// -----------------------------------------------------
// INCORPORAMENTO PDF CON RITAGLIO
// -----------------------------------------------------

async function embedLabel(out, item) {
  const sourcePage =
    item.sourceDoc.getPages()[item.pageIndex];

  return await out.embedPage(
    sourcePage,
    item.crop || undefined
  );
}


// -----------------------------------------------------
// POSIZIONAMENTO
// -----------------------------------------------------

function quadrantBox(slot) {
  const col = slot % 2;
  const row = Math.floor(slot / 2);

  return {
    x: col * HALF_W,
    y: row === 0 ? HALF_H : 0,
    width: HALF_W,
    height: HALF_H
  };
}


function halfBox(slot) {
  return {
    x: 0,
    y: slot === 0 ? HALF_H : 0,
    width: A4.width,
    height: HALF_H
  };
}


// Calcola se l'etichetta entra.
// Non ingrandisce mai e mantiene le proporzioni.
// Può ruotare di 90 gradi se necessario.

function fitInBox(embedded, box, options = {}) {
  const allowRotate = options.allowRotate ?? true;
  const maxShrink = options.maxShrink ?? 0;

  const choices = [
    {
      rotation: 0,
      width: embedded.width,
      height: embedded.height
    }
  ];

  if (allowRotate) {
    choices.push({
      rotation: 90,
      width: embedded.height,
      height: embedded.width
    });
  }

  let best = null;

  for (const choice of choices) {
    const scale = Math.min(
      1,
      box.width / choice.width,
      box.height / choice.height
    );

    if (scale < 1 - maxShrink - 0.000001) {
      continue;
    }

    if (!best || scale > best.scale) {
      best = {
        rotation: choice.rotation,
        scale,
        width: choice.width * scale,
        height: choice.height * scale
      };
    }
  }

  return best;
}


// Disegna centrando l'etichetta nel quadrante.

function drawFitted(page, embedded, box, fit) {
  const left =
    box.x + (box.width - fit.width) / 2;

  const bottom =
    box.y + (box.height - fit.height) / 2;

  const drawWidth =
    embedded.width * fit.scale;

  const drawHeight =
    embedded.height * fit.scale;

  if (fit.rotation === 0) {
    page.drawPage(embedded, {
      x: left,
      y: bottom,
      width: drawWidth,
      height: drawHeight
    });

  } else {
    page.drawPage(embedded, {
      x: left + fit.width,
      y: bottom,
      width: drawWidth,
      height: drawHeight,
      rotate: PDFLib.degrees(90)
    });
  }
}


// -----------------------------------------------------
// COMPOSIZIONE DEL PDF V5
// -----------------------------------------------------

async function compose(inpostLabels, otherLabels) {
  const out = await PDFLib.PDFDocument.create();

  out.setTitle(
    'Etichette spedizioni - impaginato A4'
  );

  const preparedInpost = [];
  const preparedOther = [];

  // Incorpora le InPost.

  for (const item of inpostLabels) {
    preparedInpost.push({
      item,
      embedded: await embedLabel(out, item),
      kind: 'I',
      fit: null
    });
  }

  // Incorpora BRT e DPD.

  for (const item of otherLabels) {
    preparedOther.push({
      item,
      embedded: await embedLabel(out, item),
      kind: 'O',
      fit: null
    });
  }

  const pagePlans = [];


  // ===============================================
  // 1. INPOST: QUATTRO PER FOGLIO
  // ===============================================

  for (
    let start = 0;
    start < preparedInpost.length;
    start += 4
  ) {
    const slots = [
      null,
      null,
      null,
      null
    ];

    preparedInpost
      .slice(start, start + 4)
      .forEach((entry, index) => {
        slots[index] = entry;
      });

    pagePlans.push({
      mode: 'Q',
      slots
    });
  }


  // ===============================================
  // 2. DIVIDE LE ALTRE ETICHETTE
  // ===============================================

  const quadrantEligible = [];
  const twoUpOnly = [];

  const standardQuadrant = quadrantBox(0);

  for (const entry of preparedOther) {
    const fit = fitInBox(
      entry.embedded,
      standardQuadrant,
      {
        allowRotate: true,
        maxShrink: MAX_QUADRANT_SHRINK
      }
    );

    if (fit) {
      entry.fit = fit;
      quadrantEligible.push(entry);
    } else {
      twoUpOnly.push(entry);
    }
  }


  // ===============================================
  // 3. RIEMPIE I QUADRANTI VUOTI
  // NELL'ULTIMA PAGINA INPOST
  // ===============================================

  let nextEligible = 0;
  let otherInQuadrants = 0;

  if (
    pagePlans.length > 0 &&
    quadrantEligible.length > 0
  ) {
    const lastInpostPage =
      pagePlans[pagePlans.length - 1];

    for (let slot = 0; slot < 4; slot++) {
      if (lastInpostPage.slots[slot]) {
        continue;
      }

      if (nextEligible >= quadrantEligible.length) {
        break;
      }

      lastInpostPage.slots[slot] =
        quadrantEligible[nextEligible++];

      otherInQuadrants++;
    }
  }


  // ===============================================
  // 4. LE ALTRE IDONEE: QUATTRO PER FOGLIO
  // ===============================================

  while (nextEligible < quadrantEligible.length) {
    const slots = [
      null,
      null,
      null,
      null
    ];

    for (
      let slot = 0;
      slot < 4 &&
      nextEligible < quadrantEligible.length;
      slot++
    ) {
      slots[slot] = quadrantEligible[nextEligible++];

      otherInQuadrants++;
    }

    pagePlans.push({
      mode: 'Q',
      slots
    });
  }


  // ===============================================
  // 5. SOLO LE ETICHETTE TROPPO GRANDI:
  // DUE PER FOGLIO A4, SENZA RIDUZIONE
  // ===============================================

  for (
    let start = 0;
    start < twoUpOnly.length;
    start += 2
  ) {
    const slots = [
      null,
      null
    ];

    twoUpOnly
      .slice(start, start + 2)
      .forEach((entry, index) => {
        slots[index] = entry;
      });

    pagePlans.push({
      mode: 'H',
      slots
    });
  }


  // ===============================================
  // 6. DISEGNA LE PAGINE E CREA LA MAPPA
  // ===============================================

  const layoutCodes = [];

  for (const plan of pagePlans) {
    const page = out.addPage([
      A4.width,
      A4.height
    ]);

    // ---------------------------------------------
    // PAGINA A QUATTRO QUADRANTI
    // ---------------------------------------------

    if (plan.mode === 'Q') {
      const code = plan.slots
        .map(entry => entry ? entry.kind : '-')
        .join('');

      layoutCodes.push(`Q:${code}`);

      for (let slot = 0; slot < 4; slot++) {
        const entry = plan.slots[slot];

        if (!entry) continue;

        const box = quadrantBox(slot);

        let fit;

        if (entry.kind === 'I') {
          fit = fitInBox(
            entry.embedded,
            box,
            {
              allowRotate: false,
              maxShrink: MAX_QUADRANT_SHRINK
            }
          );

        } else {
          fit = entry.fit || fitInBox(
            entry.embedded,
            box,
            {
              allowRotate: true,
              maxShrink: MAX_QUADRANT_SHRINK
            }
          );
        }

        if (!fit) {
          throw new Error(
            `L'etichetta ${entry.item.fileName}, pagina ${entry.item.pageNumber}, non entra nel quadrante con una riduzione massima del 2%.`
          );
        }

        drawFitted(
          page,
          entry.embedded,
          box,
          fit
        );
      }

    } else {

      // -------------------------------------------
      // PAGINA A DUE ETICHETTE
      // -------------------------------------------

      const code = plan.slots
        .map(entry => entry ? 'O' : '-')
        .join('');

      layoutCodes.push(`H:${code}`);

      for (let slot = 0; slot < 2; slot++) {
        const entry = plan.slots[slot];

        if (!entry) continue;

        const box = halfBox(slot);

        // Nessuna riduzione nelle pagine a due.
        const fit = fitInBox(
          entry.embedded,
          box,
          {
            allowRotate: false,
            maxShrink: 0
          }
        );

        if (!fit) {
          throw new Error(
            `L'etichetta ${entry.item.fileName}, pagina ${entry.item.pageNumber}, non entra neanche nella metà A4 senza ridimensionamento.`
          );
        }

        drawFitted(
          page,
          entry.embedded,
          box,
          fit
        );
      }
    }
  }


  // ===============================================
  // 7. SALVA LA MAPPA NEI METADATI
  // ===============================================

  const metadataMap =
    `${LAYOUT_MARKER}|${layoutCodes.join(';')}`;

  out.setSubject(metadataMap);

  out.setKeywords([
    LAYOUT_MARKER,
    'etichette',
    'spedizioni',
    `pages:${layoutCodes.length}`
  ]);

  return {
    bytes: await out.save(),
    layout: pagePlans,
    otherInQuadrants,
    otherTwoUp: twoUpOnly.length
  };
}


// -----------------------------------------------------
// ANTEPRIMA DEL PDF
// -----------------------------------------------------

async function renderPreview(pdfBytes) {
  preview.replaceChildren();

  const pdf = await pdfjsLib.getDocument({
    data: pdfBytes.slice()
  }).promise;

  for (
    let pageNo = 1;
    pageNo <= pdf.numPages;
    pageNo++
  ) {
    const page = await pdf.getPage(pageNo);

    const host = document.createElement('article');
    host.className = 'preview-page';

    const title = document.createElement('p');
    title.className = 'page-name';

    title.textContent =
      `Foglio A4 ${pageNo} di ${pdf.numPages}`;

    const canvas = document.createElement('canvas');

    const base = page.getViewport({
      scale: 1
    });

    const scale = Math.min(
      1.35,
      660 / base.width
    );

    const viewport = page.getViewport({
      scale
    });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    const context = canvas.getContext('2d');

    if (!context) {
      throw new Error(
        'Impossibile generare l’anteprima nel browser.'
      );
    }

    host.append(title, canvas);
    preview.append(host);

    await page.render({
      canvasContext: context,
      viewport
    }).promise;
  }
}
