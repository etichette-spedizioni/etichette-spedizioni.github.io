
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Etichette spedizioni</title>

<style>
:root {
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #f5f6f7;
  color: #171717;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

main {
  width: min(900px, 100%);
  margin: 0 auto;
  padding: 28px 18px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

#pick {
  appearance: none;
  border: 0;
  border-radius: 12px;
  background: #161616;
  color: #fff;
  padding: 17px 28px;
  font: 650 17px system-ui;
  cursor: pointer;
  min-width: min(300px, 92vw);
  box-shadow: 0 2px 8px #00000016;
}

#pick:disabled {
  opacity: .55;
  cursor: wait;
}

#files {
  display: none;
}

#status {
  min-height: 24px;
  color: #555;
  font-size: 14px;
  text-align: center;
  max-width: 680px;
  line-height: 1.45;
}

#result {
  display: none;
  width: 100%;
}

.result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 4px 0 14px;
}

.result-head h2 {
  font-size: 17px;
  font-weight: 650;
  margin: 0;
}

#download {
  color: #1558b0;
  text-decoration: underline;
  text-underline-offset: 3px;
  font-size: 14px;
  font-weight: 600;
}

#preview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
  gap: 16px;
  align-items: start;
}

.preview-page {
  background: #fff;
  border: 1px solid #d8dadd;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 2px 8px #0000000b;
}

.page-name {
  font-size: 12px;
  color: #666;
  margin: 0 0 8px;
}

.preview-page canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
}

.note {
  font-size: 12px;
  color: #777;
  text-align: center;
  line-height: 1.45;
  max-width: 650px;
}

@media(max-width:520px) {
  main {
    padding: 20px 12px 32px;
  }

  #preview {
    grid-template-columns: 1fr;
  }

  .preview-page {
    padding: 7px;
  }
}
</style>
</head>

<body>
<main>

  <input
    id="files"
    type="file"
    accept="application/pdf,.pdf"
    multiple
  >

  <button id="pick" type="button">
    ＋ Seleziona i PDF
  </button>

  <div id="status" role="status" aria-live="polite">
    Seleziona uno o più PDF. Puoi aggiungere nuove etichette anche a un PDF A4 già preparato.
  </div>

  <section id="result" aria-live="polite">

    <div class="result-head">
      <h2>Anteprima del PDF A4</h2>

      <a
        id="download"
        href="#"
        download="etichette_pronte_A4.pdf"
      >
        Scarica il PDF pronto
      </a>
    </div>

    <div id="preview"></div>

  </section>

  <div class="note">
    Controlla l'anteprima prima di stampare.
    Imposta la stampa su A4, dimensioni effettive / 100%,
    senza adattamento automatico alla pagina.
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
'use strict';

// =====================================================
// CONFIGURAZIONE
// =====================================================

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const input = document.getElementById('files');
const button = document.getElementById('pick');
const statusBox = document.getElementById('status');
const result = document.getElementById('result');
const preview = document.getElementById('preview');
const download = document.getElementById('download');

const A4 = {
  width: 595.2756,
  height: 841.8898
};

const HALF_W = A4.width / 2;
const HALF_H = A4.height / 2;

// Firma dei PDF creati da questa versione.
const LAYOUT_MARKER = 'ETICHETTE_SPEDIZIONI_LAYOUT_V4';

// Firma della precedente versione.
const LEGACY_MARKER = 'ETICHETTE_SPEDIZIONI_LAYOUT_V3';

// Riduzione massima ammessa nei quadranti: 2%.
const MAX_QUADRANT_SHRINK = 0.02;

let currentUrl = null;


// =====================================================
// PULSANTE E SELEZIONE DEI FILE
// =====================================================

button.addEventListener('click', () => input.click());

input.addEventListener('change', async () => {

  if (!input.files || input.files.length === 0) {
    return;
  }

  button.disabled = true;
  result.style.display = 'none';
  preview.replaceChildren();

  statusBox.textContent =
    'Sto leggendo i PDF e recuperando le etichette…';

  try {

    const inpost = [];
    const other = [];

    let importedInpost = 0;
    let importedOther = 0;

    const selectedFiles = Array.from(input.files);

    for (const file of selectedFiles) {

      if (
        file.type &&
        file.type !== 'application/pdf' &&
        !file.name.toLowerCase().endsWith('.pdf')
      ) {
        continue;
      }

      const bytes = new Uint8Array(await file.arrayBuffer());

      const pdfJsDoc = await pdfjsLib.getDocument({
        data: bytes.slice()
      }).promise;

      const sourceDoc = await PDFLib.PDFDocument.load(bytes);

      const metadata = await pdfJsDoc
        .getMetadata()
        .catch(() => null);

      const info = metadata?.info || {};

      const subject = String(
        info.Subject || info.subject || ''
      );

      const keywords = String(
        info.Keywords || info.keywords || ''
      );

      const title = String(
        info.Title || info.title || ''
      );

      const metaText = [
        subject,
        keywords,
        title
      ].join(' ').toUpperCase();

      const isV4 = metaText.includes(LAYOUT_MARKER);
      const isV3 = metaText.includes(LEGACY_MARKER);

      // La nuova versione contiene una mappa precisa
      // dei quadranti e delle metà occupate.
      const generatedLayout = isV4
        ? parseGeneratedLayout(subject)
        : null;

      if (isV4 && !generatedLayout) {
        throw new Error(
          `Il PDF ${file.name} contiene la firma della versione 4, ma non la mappa delle pagine.`
        );
      }

      if (
        isV4 &&
        generatedLayout.length !== pdfJsDoc.numPages
      ) {
        throw new Error(
          `La mappa del PDF ${file.name} non corrisponde al numero delle pagine.`
        );
      }

      for (
        let pageNumber = 1;
        pageNumber <= pdfJsDoc.numPages;
        pageNumber++
      ) {

        statusBox.textContent =
          `Analisi: ${file.name} — pagina ${pageNumber}/${pdfJsDoc.numPages}…`;

        const jsPage = await pdfJsDoc.getPage(pageNumber);

        const viewport = jsPage.getViewport({
          scale: 1
        });

        const sourcePage = sourceDoc.getPages()[pageNumber - 1];

        const sourceWidth = sourcePage.getWidth();
        const sourceHeight = sourcePage.getHeight();

        const textContent = await jsPage.getTextContent();

        const text = textContent.items
          .filter(item => (item.str || '').trim())
          .map(item => item.str || '')
          .join(' ')
          .toLowerCase();

        const pageIndex = pageNumber - 1;

        const a4Portrait = isA4Portrait(
          viewport.width,
          viewport.height
        );


        // =============================================
        // PDF GIÀ CREATO CON VERSIONE 4
        // =============================================

        if (isV4) {

          const layout = generatedLayout[pageIndex];

          const crops = layout.mode === 'Q'
            ? getQuadrantCrops(sourceWidth, sourceHeight)
            : getHalfCrops(sourceWidth, sourceHeight);

          for (
            let slot = 0;
            slot < layout.slots.length;
            slot++
          ) {

            const code = layout.slots[slot];

            if (code === '-') {
              continue;
            }

            const crop = crops[slot];

            if (code === 'I') {

              inpost.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  'inpost',
                  crop
                )
              );

              importedInpost++;

            } else if (code === 'O') {

              const kind = layout.mode === 'Q'
                ? 'imported-quadrant'
                : 'imported-half';

              other.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  kind,
                  crop
                )
              );

              importedOther++;

            }
          }

          continue;
        }


        // =============================================
        // COMPATIBILITÀ CON VERSIONE 3
        // =============================================

        if (isV3 && a4Portrait) {

          const isInpostPage =
            text.includes('deposito') &&
            text.includes('giro');

          const mode = isInpostPage
            ? 'quadrants'
            : 'halves';

          const occupied = await findOccupiedRegions(
            jsPage,
            mode
          );

          const crops = isInpostPage
            ? getQuadrantCrops(sourceWidth, sourceHeight)
            : getHalfCrops(sourceWidth, sourceHeight);

          for (
            let slot = 0;
            slot < occupied.length;
            slot++
          ) {

            if (!occupied[slot]) {
              continue;
            }

            if (isInpostPage) {

              inpost.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  'inpost',
                  crops[slot]
                )
              );

              importedInpost++;

            } else {

              other.push(
                makeItem(
                  file.name,
                  pageNumber,
                  sourceDoc,
                  pageIndex,
                  'imported-half',
                  crops[slot]
                )
              );

              importedOther++;

            }
          }

          continue;
        }


        // =============================================
        // PDF ORIGINALI
        // =============================================

        const kind = classifySourcePage(
          text,
          viewport.width,
          viewport.height
        );

        if (!kind) {

          throw new Error(
            `Formato non riconosciuto: ${file.name}, pagina ${pageNumber}. Controlla che sia un PDF InPost, BRT o DPD supportato.`
          );

        }

        const crop = getSourceCrop(
          kind,
          sourceWidth,
          sourceHeight
        );

        const item = makeItem(
          file.name,
          pageNumber,
          sourceDoc,
          pageIndex,
          kind,
          crop
        );

        if (kind === 'inpost') {
          inpost.push(item);
        } else {
          other.push(item);
        }

      }
    }


    // ===============================================
    // CONTROLLO DEL RISULTATO
    // ===============================================

    if (inpost.length + other.length === 0) {

      throw new Error(
        'Non ho trovato etichette nei PDF selezionati.'
      );

    }


    // ===============================================
    // COMPOSIZIONE DEL PDF
    // ===============================================

    statusBox.textContent =
      'Sto impaginando le etichette e preparando l’anteprima…';

    const composed = await compose(inpost, other);

    const outputBytes = composed.bytes;

    const blob = new Blob(
      [outputBytes],
      { type: 'application/pdf' }
    );

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
    }

    currentUrl = URL.createObjectURL(blob);

    download.href = currentUrl;

    result.style.display = 'block';


    // ===============================================
    // ANTEPRIMA
    // ===============================================

    await renderPreview(outputBytes);


    // ===============================================
    // MESSAGGIO FINALE
    // ===============================================

    const totalPages = composed.layout.length;

    const importedTotal =
      importedInpost + importedOther;

    const importedMessage = importedTotal
      ? ` Recuperate ${importedTotal} etichette dai PDF già preparati: ${importedInpost} InPost e ${importedOther} altre.`
      : '';

    statusBox.textContent =
      `PDF pronto: ${inpost.length} InPost e ${other.length} altre etichette. ` +
      `${composed.mixedOther} altre etichette inserite nei quadranti liberi. ` +
      `${composed.standaloneOther} etichette rimaste nei fogli a due. ` +
      `Totale: ${totalPages} pagine A4.` +
      importedMessage;

    result.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      error && error.message
        ? error.message
        : 'Errore durante la preparazione del PDF.';

    result.style.display = 'none';

  } finally {

    button.disabled = false;
    input.value = '';

  }

});


// =====================================================
// RICONOSCIMENTO DEI PDF GENERATI
// =====================================================

function parseGeneratedLayout(subject) {

  const marker = LAYOUT_MARKER + '|';

  const position = String(subject).indexOf(marker);

  if (position < 0) {
    return null;
  }

  const encoded = String(subject)
    .slice(position + marker.length)
    .trim();

  if (!encoded) {
    return null;
  }

  const records = encoded
    .split(';')
    .map(value => value.trim())
    .filter(Boolean);

  const layouts = [];

  for (const record of records) {

    const separator = record.indexOf(':');

    if (separator < 0) {
      return null;
    }

    const mode = record.slice(0, separator);
    const slots = record.slice(separator + 1);

    if (mode === 'Q') {

      if (
        slots.length !== 4 ||
        !/^[IO-]{4}$/.test(slots)
      ) {
        return null;
      }

      layouts.push({
        mode: 'Q',
        slots: slots.split('')
      });

    } else if (mode === 'H') {

      if (
        slots.length !== 2 ||
        !/^[O-]{2}$/.test(slots)
      ) {
        return null;
      }

      layouts.push({
        mode: 'H',
        slots: slots.split('')
      });

    } else {

      return null;

    }

  }

  return layouts.length ? layouts : null;
}


// =====================================================
// FORMATI E DIMENSIONI
// =====================================================

function isA4Portrait(width, height) {

  return (
    Math.abs(width - A4.width) < 3 &&
    Math.abs(height - A4.height) < 3
  );

}


function makeItem(
  fileName,
  pageNumber,
  sourceDoc,
  pageIndex,
  kind,
  crop
) {

  return {
    fileName,
    pageNumber,
    sourceDoc,
    pageIndex,
    kind,
    crop
  };

}


// =====================================================
// RICONOSCIMENTO DELLE ETICHETTE ORIGINALI
// =====================================================

function classifySourcePage(text, width, height) {

  const normalized = text.toLowerCase();
  const aspect = width / height;

  // INPOST
  if (
    normalized.includes('deposito') &&
    normalized.includes('giro') &&
    normalized.includes('mittente')
  ) {
    return 'inpost';
  }

  // DPD CON FOGLIO DI ISTRUZIONI
  if (
    (
      normalized.includes("stampare l'etichetta") ||
      normalized.includes('un rapido taglio') ||
      normalized.includes('imballare tutto in modo sicuro')
    ) &&
    normalized.includes('order reference')
  ) {
    return 'instructions';
  }

  // BRT / DPD
  if (
    normalized.includes('terms & conditions of services') ||
    normalized.includes('www.dpd.com') ||
    normalized.includes('brt s.p.a.')
  ) {
    return 'brt';
  }

  return null;
}


// =====================================================
// RITAGLIO DEI PDF ORIGINALI
// =====================================================

// Coordinate PDF: origine in basso a sinistra.
// Le percentuali si riferiscono ai modelli forniti.

function getSourceCrop(kind, width, height) {

  if (kind === 'inpost') {
    return null;
  }

  // Etichetta DPD con istruzioni nella parte superiore.
  if (kind === 'instructions') {

    return {
      left: width * 0.143277,
      bottom: height * (1 - 0.956942),
      right: width * 0.856723,
      top: height * (1 - 0.620439)
    };

  }

  // Etichetta BRT.
  if (kind === 'brt') {

    return {
      left: width * 0.075427,
      bottom: height * (1 - 0.625973),
      right: width * 0.542102,
      top: height * (1 - 0.175082)
    };

  }

  throw new Error(
    'Tipo di etichetta non gestito.'
  );

}


// =====================================================
// RITAGLI DELLE PAGINE GIÀ IMPAGINATE
// =====================================================

function getQuadrantCrops(width, height) {

  const hw = width / 2;
  const hh = height / 2;

  // Ordine:
  // 0: alto sinistra
  // 1: alto destra
  // 2: basso sinistra
  // 3: basso destra

  return [

    {
      left: 0,
      bottom: hh,
      right: hw,
      top: height
    },

    {
      left: hw,
      bottom: hh,
      right: width,
      top: height
    },

    {
      left: 0,
      bottom: 0,
      right: hw,
      top: hh
    },

    {
      left: hw,
      bottom: 0,
      right: width,
      top: hh
    }

  ];

}


function getHalfCrops(width, height) {

  const hh = height / 2;

  return [

    {
      left: 0,
      bottom: hh,
      right: width,
      top: height
    },

    {
      left: 0,
      bottom: 0,
      right: width,
      top: hh
    }

  ];

}


// =====================================================
// RICONOSCIMENTO DEGLI SPAZI OCCUPATI NELLA VERSIONE 3
// =====================================================

async function findOccupiedRegions(pdfPage, mode) {

  const scale = 0.35;

  const viewport = pdfPage.getViewport({
    scale
  });

  const canvas = document.createElement('canvas');

  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);

  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  if (!context) {
    throw new Error(
      'Impossibile analizzare una pagina PDF nel browser.'
    );
  }

  context.fillStyle = '#ffffff';

  context.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  await pdfPage.render({
    canvasContext: context,
    viewport
  }).promise;

  const image = context.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;

  const regions = mode === 'quadrants'
    ? [
        [0, 0, 0.5, 0.5],
        [0.5, 0, 1, 0.5],
        [0, 0.5, 0.5, 1],
        [0.5, 0.5, 1, 1]
      ]
    : [
        [0, 0, 1, 0.5],
        [0, 0.5, 1, 1]
      ];

  return regions.map(([rx0, ry0, rx1, ry1]) => {

    const x0 = Math.floor(rx0 * canvas.width);
    const x1 = Math.ceil(rx1 * canvas.width);

    const y0 = Math.floor(ry0 * canvas.height);
    const y1 = Math.ceil(ry1 * canvas.height);

    let darkSamples = 0;

    for (let y = y0; y < y1; y += 2) {

      for (let x = x0; x < x1; x += 2) {

        const p = (y * canvas.width + x) * 4;

        const brightness = (
          image[p] +
          image[p + 1] +
          image[p + 2]
        ) / 3;

        if (
          brightness < 242 &&
          image[p + 3] > 0
        ) {
          darkSamples++;
        }

        if (darkSamples > 7) {
          return true;
        }

      }

    }

    return false;

  });

}


// =====================================================
// INCORPORAMENTO DELLE ETICHETTE
// =====================================================

async function embedLabel(out, item) {

  const sourcePage = item.sourceDoc.getPages()[
    item.pageIndex
  ];

  // embedPage permette di ritagliare la pagina sorgente.
  return await out.embedPage(
    sourcePage,
    item.crop || undefined
  );

}


// =====================================================
// DIMENSIONI E ADATTAMENTO NEI QUADRANTI
// =====================================================

// Calcola la migliore disposizione possibile.
// Non ingrandisce mai le etichette.
// Mantiene sempre le proporzioni.

function fitInBox(
  embedded,
  box,
  options = {}
) {

  const allowRotate = options.allowRotate ?? true;

  const maxShrink = options.maxShrink ?? 0;

  const choices = [

    {
      rotation: 0,
      width: embedded.width,
      height: embedded.height
    }

  ];

  if (allowRotate) {

    choices.push({
      rotation: 90,
      width: embedded.height,
      height: embedded.width
    });

  }

  let best = null;

  for (const choice of choices) {

    const scale = Math.min(
      1,
      box.width / choice.width,
      box.height / choice.height
    );

    if (scale < 1 - maxShrink) {
      continue;
    }

    if (!best || scale > best.scale + 0.000001) {

      best = {
        rotation: choice.rotation,
        scale,
        width: choice.width * scale,
        height: choice.height * scale
      };

    }

  }

  return best;

}


// Posizione e disegno, eventualmente con rotazione.

function drawFitted(page, embedded, box, fit) {

  const left = box.x + (
    box.width - fit.width
  ) / 2;

  const bottom = box.y + (
    box.height - fit.height
  ) / 2;

  const width = embedded.width * fit.scale;
  const height = embedded.height * fit.scale;

  if (fit.rotation === 0) {

    page.drawPage(embedded, {

      x: left,
      y: bottom,
      width,
      height

    });

  } else {

    page.drawPage(embedded, {

      x: left + fit.width,
      y: bottom,
      width,
      height,
      rotate: PDFLib.degrees(90)

    });

  }

}


// Posizione dei quattro quadranti.

function quadrantBox(slot) {

  const col = slot % 2;
  const row = Math.floor(slot / 2);

  return {

    x: col * HALF_W,

    y: row === 0
      ? HALF_H
      : 0,

    width: HALF_W,
    height: HALF_H

  };

}


// Posizione delle due metà A4.

function halfBox(slot) {

  return {

    x: 0,

    y: slot === 0
      ? HALF_H
      : 0,

    width: A4.width,
    height: HALF_H

  };

}


// =====================================================
// COMPOSIZIONE DEL PDF FINALE
// =====================================================

async function compose(inpostLabels, otherLabels) {

  const out = await PDFLib.PDFDocument.create();

  out.setTitle(
    'Etichette spedizioni - impaginato A4'
  );

  const preparedInpost = [];

  const preparedOther = [];


  // Prima incorpora tutte le InPost.

  for (const item of inpostLabels) {

    const embedded = await embedLabel(out, item);

    preparedInpost.push({

      item,
      embedded,
      kind: 'I',
      fit: null

    });

  }


  // Poi incorpora tutte le altre etichette.

  for (const item of otherLabels) {

    const embedded = await embedLabel(out, item);

    preparedOther.push({

      item,
      embedded,
      kind: 'O',
      fit: null

    });

  }


  const pagePlans = [];


  // ===============================================
  // PAGINE INPOST
  // ===============================================

  for (
    let start = 0;
    start < preparedInpost.length;
    start += 4
  ) {

    const slots = [
      null,
      null,
      null,
      null
    ];

    const batch = preparedInpost.slice(
      start,
      start + 4
    );

    batch.forEach((entry, index) => {
      slots[index] = entry;
    });

    pagePlans.push({

      mode: 'Q',
      slots

    });

  }


  // ===============================================
  // RIEMPIMENTO DEI QUADRANTI VUOTI
  // DELL'ULTIMA PAGINA INPOST
  // ===============================================

  const usedOther = new Set();

  let mixedOther = 0;

  if (pagePlans.length > 0) {

    const lastPage =
      pagePlans[pagePlans.length - 1];

    for (let slot = 0; slot < 4; slot++) {

      // Salta i quadranti già occupati da InPost.
      if (lastPage.slots[slot]) {
        continue;
      }

      const box = quadrantBox(slot);

      let chosenIndex = -1;
      let chosenFit = null;

      // Cerca la prima etichetta non-InPost che entra
      // nel quadrante senza superare il 2% di riduzione.

      for (
        let i = 0;
        i < preparedOther.length;
        i++
      ) {

        if (usedOther.has(i)) {
          continue;
        }

        const candidate = preparedOther[i];

        const fit = fitInBox(
          candidate.embedded,
          box,
          {
            allowRotate: true,
            maxShrink: MAX_QUADRANT_SHRINK
          }
        );

        if (fit) {

          chosenIndex = i;
          chosenFit = fit;

          break;

        }

      }

      // Se nessuna etichetta entra, lascia vuoto
      // il quadrante e passa al successivo.

      if (chosenIndex < 0) {
        continue;
      }

      const chosen = preparedOther[chosenIndex];

      chosen.fit = chosenFit;

      lastPage.slots[slot] = chosen;

      usedOther.add(chosenIndex);

      mixedOther++;

    }

  }


  // ===============================================
  // ETICHETTE RIMASTE: DUE PER FOGLIO
  // ===============================================

  const standalone = preparedOther.filter(
    (_, index) => !usedOther.has(index)
  );


  for (
    let start = 0;
    start < standalone.length;
    start += 2
  ) {

    const slots = [
      null,
      null
    ];

    const batch = standalone.slice(
      start,
      start + 2
    );

    batch.forEach((entry, index) => {
      slots[index] = entry;
    });

    pagePlans.push({

      mode: 'H',
      slots

    });

  }


  // ===============================================
  // CREAZIONE DELLE PAGINE E MAPPA METADATI
  // ===============================================

  const layoutCodes = [];

  for (const plan of pagePlans) {

    const page = out.addPage([
      A4.width,
      A4.height
    ]);


    // ---------------------------------------------
    // PAGINA DIVISA IN QUATTRO QUADRANTI
    // ---------------------------------------------

    if (plan.mode === 'Q') {

      const code = plan.slots
        .map(entry => entry ? entry.kind : '-')
        .join('');

      layoutCodes.push(
        `Q:${code}`
      );

      for (let slot = 0; slot < 4; slot++) {

        const entry = plan.slots[slot];

        if (!entry) {
          continue;
        }

        const box = quadrantBox(slot);

        let fit = entry.fit;

        // Le InPost conservano il formato verticale.
        if (entry.kind === 'I') {

          fit = fitInBox(
            entry.embedded,
            box,
            {
              allowRotate: false,
              maxShrink: MAX_QUADRANT_SHRINK
            }
          );

        }

        // Per le altre etichette si può ruotare di 90°.
        if (!fit) {

          fit = fitInBox(
            entry.embedded,
            box,
            {
              allowRotate: entry.kind !== 'I',
              maxShrink: MAX_QUADRANT_SHRINK
            }
          );

        }

        if (!fit) {

          throw new Error(
            `L'etichetta ${entry.item.fileName}, pagina ${entry.item.pageNumber}, non entra nel quadrante nemmeno con una riduzione del 2%.`
          );

        }

        drawFitted(
          page,
          entry.embedded,
          box,
          fit
        );

      }

    }


    // ---------------------------------------------
    // PAGINA CON DUE ETICHETTE
    // ---------------------------------------------

    else {

      const code = plan.slots
        .map(entry => entry ? 'O' : '-')
        .join('');

      layoutCodes.push(
        `H:${code}`
      );

      for (let slot = 0; slot < 2; slot++) {

        const entry = plan.slots[slot];

        if (!entry) {
          continue;
        }

        const box = halfBox(slot);

        // Nelle pagine a due etichette non ridimensioniamo.
        const fit = fitInBox(
          entry.embedded,
          box,
          {
            allowRotate: false,
            maxShrink: 0
          }
        );

        if (!fit) {

          throw new Error(
            `L'etichetta ${entry.item.fileName}, pagina ${entry.item.pageNumber}, non entra nella metà A4 con le dimensioni originali.`
          );

        }

        drawFitted(
          page,
          entry.embedded,
          box,
          fit
        );

      }

    }

  }


  // ===============================================
  // METADATI: MEMORIZZAZIONE DELLA DISPOSIZIONE
  // ===============================================

  const layoutMetadata = [
    LAYOUT_MARKER,
    layoutCodes.join(';')
  ].join('|');

  out.setSubject(layoutMetadata);

  out.setKeywords([
    LAYOUT_MARKER,
    'etichette',
    'spedizioni',
    `pages:${layoutCodes.length}`
  ]);

  return {

    bytes: await out.save(),

    layout: pagePlans,

    mixedOther,

    standaloneOther: standalone.length

  };

}


// =====================================================
// ANTEPRIMA DEL PDF
// =====================================================

async function renderPreview(pdfBytes) {

  preview.replaceChildren();

  const pdf = await pdfjsLib.getDocument({
    data: pdfBytes.slice()
  }).promise;

  for (
    let pageNo = 1;
    pageNo <= pdf.numPages;
    pageNo++
  ) {

    const page = await pdf.getPage(pageNo);

    const host = document.createElement('article');

    host.className = 'preview-page';

    const title = document.createElement('p');

    title.className = 'page-name';

    title.textContent =
      `Foglio A4 ${pageNo} di ${pdf.numPages}`;

    const canvas = document.createElement('canvas');

    const base = page.getViewport({
      scale: 1
    });

    const scale = Math.min(
      1.35,
      660 / base.width
    );

    const viewport = page.getViewport({
      scale
    });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    host.append(title, canvas);

    preview.append(host);

    const context = canvas.getContext('2d');

    if (!context) {
      throw new Error(
        'Impossibile generare l’anteprima nel browser.'
      );
    }

    await page.render({

      canvasContext: context,
      viewport

    }).promise;

  }

}
